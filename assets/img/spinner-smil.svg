<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-label="TMS NeuroPilot loading">
  <rect width="192" height="192" rx="42" fill="#1B2028"/>
  <g transform="translate(96 96)">
    <circle r="86" fill="none" stroke="#F2A93F" stroke-width="9"      stroke-dasharray="464.7 75.6"      stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="13" fill="#F2A93F">
      <animate attributeName="r" values="10;14;10" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
