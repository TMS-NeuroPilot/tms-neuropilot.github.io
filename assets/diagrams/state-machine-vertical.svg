<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 840" width="560" height="840" role="img" aria-label="Controller state machine (vertical)"><title>Controller state machine (vertical)</title><rect width="560" height="840" rx="12" fill="#FFFFFF"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5A636E"/></marker></defs><text x="280" y="30" font-size="17" font-weight="700" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">The controller state machine</text><rect x="170" y="70" width="220" height="56" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="280.0" y="102.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">INIT</text><rect x="170" y="150" width="220" height="56" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="280.0" y="182.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">SEND_MARKER</text><rect x="170" y="230" width="220" height="56" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="280.0" y="262.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">START_TRACKING</text><rect x="170" y="310" width="220" height="56" rx="10" fill="#FDF3E7" stroke="#B45309" stroke-width="1.4"/><text x="280.0" y="342.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">WAIT_FOR_TARGET</text><rect x="170" y="390" width="220" height="56" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="280.0" y="422.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">FIRE</text><rect x="170" y="470" width="220" height="56" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="280.0" y="502.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">COLLECT</text><rect x="170" y="550" width="220" height="56" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="280.0" y="582.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">ANALYSE</text><rect x="170" y="630" width="220" height="56" rx="10" fill="#E8F5EC" stroke="#15803D" stroke-width="1.4"/><text x="280.0" y="662.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">COMPLETE</text><path d="M 280 126 L 280 150" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 280 206 L 280 230" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 280 286 L 280 310" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 280 366 L 280 390" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 280 446 L 280 470" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 280 526 L 280 550" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 280 606 L 280 630" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 280 686 L 280 720" fill="none" stroke="#5A636E" stroke-width="1.6"/><path d="M 280 720 L 70 720" fill="none" stroke="#5A636E" stroke-width="1.6"/><path d="M 70 720 L 70 178" fill="none" stroke="#5A636E" stroke-width="1.6"/><path d="M 70 178 L 168 178" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><text x="185" y="742" font-size="11" font-weight="500" fill="#5A636E" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">next target</text><path d="M 390 338 L 470 338" fill="none" stroke="#5A636E" stroke-width="1.6"/><path d="M 470 338 L 470 658" fill="none" stroke="#5A636E" stroke-width="1.6"/><path d="M 470 658 L 392 658" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><text x="482" y="500" font-size="11" font-weight="600" fill="#B91C1C" text-anchor="start" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">SKIP / Next</text><text x="292" y="464" font-size="11" font-weight="500" fill="#5A636E" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">fire</text><text x="280" y="796" font-size="12" font-weight="400" fill="#5A636E" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">Finish, Skip and Next work even when a system is in</text><text x="280" y="814" font-size="12" font-weight="400" fill="#5A636E" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">error; the health gate only blocks the work steps.</text></svg>
