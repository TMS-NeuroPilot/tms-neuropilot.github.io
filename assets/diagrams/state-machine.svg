<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 360" width="1040" height="360" role="img" aria-label="Controller state machine"><title>Controller state machine</title><rect width="1040" height="360" rx="12" fill="#FFFFFF"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5A636E"/></marker></defs><text x="520" y="28" font-size="17" font-weight="700" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">The controller state machine</text><rect x="60" y="70" width="160" height="56" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="140.0" y="102.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">INIT</text><rect x="250" y="70" width="160" height="56" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="330.0" y="102.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">SEND_MARKER</text><rect x="440" y="70" width="160" height="56" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="520.0" y="102.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">START_TRACKING</text><rect x="630" y="70" width="160" height="56" rx="10" fill="#FDF3E7" stroke="#B45309" stroke-width="1.4"/><text x="710.0" y="102.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">WAIT_FOR_TARGET</text><rect x="820" y="70" width="160" height="56" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="900.0" y="102.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', '