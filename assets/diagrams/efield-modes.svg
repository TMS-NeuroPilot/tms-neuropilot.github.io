<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="E-field modes"><title>E-field modes</title><rect width="960" height="470" rx="12" fill="#FFFFFF"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5A636E"/></marker></defs><text x="480" y="30" font-size="17" font-weight="700" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">Three sources, one per-pulse row</text><rect x="30" y="60" width="170" height="60" rx="10" fill="#FDF3E7" stroke="#B45309" stroke-width="1.4"/><text x="115.0" y="86.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">E-field library</text><text x="115.0" y="102.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">E_mag row</text><path d="M 200 90 L 268 90" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="270" y="60" width="190" height="60" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="365.0" y="86.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">row of planned</text><text x="365.0" y="102.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">placement</text><text x="150" y="138" font-size="11" font-weight="500" fill="#5A636E" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">precomputed mode</text><rect x="30" y="170" width="170" height="60" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="115.0" y="196.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">realised pose</text><text x="115.0" y="212.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">from tracking</text><path d="M 200 200 L 268 200" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="270" y="170" width="190" height="60" rx="10" fill="#E8EEFC" stroke="#1D4ED8" stroke-width="1.4"/><text x="365.0" y="196.16666666666666" font-size="11" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">OnlineFEMManager</text><text x="365.0" y="211.16666666666666" font-size="11" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">solve (≈ 1 min warm-up)</text><text x="150" y="248" font-size="11" font-weight="500" fill="#5A636E" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">online mode</text><rect x="30" y="280" width="170" height="60" rx="10" fill="#E8F5EC" stroke="#15803D" stroke-width="1.4"/><text x="115.0" y="306.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">dense library</text><text x="115.0" y="322.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">E_mag + roi_hash</text><path d="M 200 310 L 268 310" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="270" y="280" width="190" height="60" rx="10" fill="#FDF3E7" stroke="#B45309" stroke-width="1.4"/><text x="365.0" y="306.1666666666667" font-size="11" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">EFieldSurrogate</text><text x="365.0" y="321.1666666666667" font-size="11" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">pose interpolation</text><text x="150" y="358" font-size="11" font-weight="500" fill="#5A636E" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">interpolated mode</text><path d="M 460 90 L 560 190" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 460 200 L 560 200" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 460 310 L 560 210" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="562" y="165" width="160" height="70" rx="10" fill="#E8F5EC" stroke="#15803D" stroke-width="1.4"/><text x="642.0" y="196.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">pulse row</text><text x="642.0" y="212.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">(n_elements,)</text><path d="M 722 200 L 790 200" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="792" y="165" width="140" height="70" rx="10" fill="#FDF3E7" stroke="#B45309" stroke-width="1.4"/><text x="862.0" y="196.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">regression</text><text x="862.0" y="212.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">MEP ~ f(E)</text><text x="480" y="410" font-size="12" font-weight="400" fill="#5A636E" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">Each pulse stores the field it was stimulated with, so the mode can change mid-run.</text><text x="480" y="430" font-size="12" font-weight="400" fill="#5A636E" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">Rows without a field are dropped and the MEP history is re-indexed with them.</text></svg>
